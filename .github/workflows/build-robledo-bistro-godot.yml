name: Build Robledo Bistro Godot Desktop

on:
  push:
    branches: [main]
    paths:
      - 'juegos/robledo_bistro_godot/**'
      - 'juegos/robledo_bistro_godot_staging/**'
      - '.github/workflows/build-robledo-bistro-godot.yml'
  pull_request:
    paths:
      - 'juegos/robledo_bistro_godot/**'
      - 'juegos/robledo_bistro_godot_staging/**'
      - '.github/workflows/build-robledo-bistro-godot.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-export:
    runs-on: ubuntu-24.04
    env:
      PROJECT_DIR: juegos/robledo_bistro_godot
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand staged Godot source
        run: |
          set -euxo pipefail
          if [ -f juegos/robledo_bistro_godot_staging/apply_payload.py ]; then
            python juegos/robledo_bistro_godot_staging/apply_payload.py
          fi
          test -s "$PROJECT_DIR/project.godot"
          test -s "$PROJECT_DIR/scripts/main.gd"
          test -s "$PROJECT_DIR/assets/ui/school_logo.webp"
          test -s "$PROJECT_DIR/data/recipes.json"
          test -s "$PROJECT_DIR/data/questions.json"

      - name: Install Godot 4.3 and export templates
        run: |
          set -euxo pipefail
          curl -L --fail -o /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.3-stable_linux.x86_64
          sudo mv /tmp/godot/Godot_v4.3-stable_linux.x86_64 /usr/local/bin/godot
          curl -L --fail -o /tmp/templates.tpz "https://github.com/godotengine/godot/releases/download/4.3-stable/Godot_v4.3-stable_export_templates.tpz"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.3.stable"
          unzip -q /tmp/templates.tpz -d /tmp/templates
          cp -a /tmp/templates/templates/. "$HOME/.local/share/godot/export_templates/4.3.stable/"
          godot --version

      - name: Import project and validate scripts
        run: |
          set -euxo pipefail
          set -o pipefail
          godot --headless --path "$PROJECT_DIR" --editor --quit-after 3 2>&1 | tee /tmp/godot-import.log
          if grep -E "SCRIPT ERROR|Parse Error|Failed to load script|Error importing" /tmp/godot-import.log; then
            echo "Godot source validation found parser/import errors." >&2
            exit 1
          fi

      - name: Export Windows and Linux
        run: |
          set -euxo pipefail
          mkdir -p "$PROJECT_DIR/build/windows" "$PROJECT_DIR/build/linux"
          WIN_OUT="$GITHUB_WORKSPACE/$PROJECT_DIR/build/windows/RobledoBistroSenior.exe"
          LINUX_OUT="$GITHUB_WORKSPACE/$PROJECT_DIR/build/linux/RobledoBistroSenior.x86_64"
          godot --headless --path "$PROJECT_DIR" --export-release "Windows Desktop" "$WIN_OUT"
          godot --headless --path "$PROJECT_DIR" --export-release "Linux" "$LINUX_OUT"
          test -s "$WIN_OUT"
          test -s "$LINUX_OUT"

      - name: Commit expanded source to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('juegos/robledo_bistro_godot_staging/apply_payload.py') != ''
        run: |
          set -euxo pipefail
          cp -a "$PROJECT_DIR/build" /tmp/robledo_bistro_build
          rm -rf juegos/robledo_bistro_godot_staging
          rm -rf "$PROJECT_DIR/.godot" "$PROJECT_DIR/build"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add juegos/robledo_bistro_godot juegos/robledo_bistro_godot_staging
          git commit -m "Expand Robledo Bistro Godot full source"
          git push
          mv /tmp/robledo_bistro_build "$PROJECT_DIR/build"

      - name: Package offline desktop builds
        run: |
          set -euxo pipefail
          mkdir -p dist/Robledo_Bistro_Godot_Full/Windows dist/Robledo_Bistro_Godot_Full/Linux dist/Robledo_Bistro_Godot_Full/Source
          cp "$PROJECT_DIR/build/windows/RobledoBistroSenior.exe" dist/Robledo_Bistro_Godot_Full/Windows/
          if [ -s "$PROJECT_DIR/build/windows/RobledoBistroSenior.pck" ]; then cp "$PROJECT_DIR/build/windows/RobledoBistroSenior.pck" dist/Robledo_Bistro_Godot_Full/Windows/; fi
          cp "$PROJECT_DIR/build/linux/RobledoBistroSenior.x86_64" dist/Robledo_Bistro_Godot_Full/Linux/
          if [ -s "$PROJECT_DIR/build/linux/RobledoBistroSenior.pck" ]; then cp "$PROJECT_DIR/build/linux/RobledoBistroSenior.pck" dist/Robledo_Bistro_Godot_Full/Linux/; fi
          cp -a "$PROJECT_DIR"/. dist/Robledo_Bistro_Godot_Full/Source/
          rm -rf dist/Robledo_Bistro_Godot_Full/Source/.godot dist/Robledo_Bistro_Godot_Full/Source/build
          cat > dist/Robledo_Bistro_Godot_Full/README_FIRST.txt <<'TXT'
          ROBLEDO BISTRO SENIOR — FULL LOCAL GODOT EDITION

          WINDOWS:
          Open Windows/RobledoBistroSenior.exe

          LINUX:
          chmod +x Linux/RobledoBistroSenior.x86_64
          ./Linux/RobledoBistroSenior.x86_64

          SOURCE:
          Open Source/project.godot with Godot 4.3+.

          This build is fully local/offline while playing. Geometry Rescue appears only after a life is lost.
          TXT
          cd dist
          zip -qr Robledo_Bistro_Godot_Full_Local.zip Robledo_Bistro_Godot_Full
          test -s Robledo_Bistro_Godot_Full_Local.zip

      - name: Upload full local game
        uses: actions/upload-artifact@v4
        with:
          name: Robledo-Bistro-Godot-Full-Local
          path: dist/Robledo_Bistro_Godot_Full_Local.zip
          if-no-files-found: error
          retention-days: 90
