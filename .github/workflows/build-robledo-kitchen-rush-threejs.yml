name: Build Robledo Kitchen Rush Three.js

on:
  push:
    branches: [main]
    paths:
      - 'juegos/robledo_kitchen_rush_3d/**'
      - '.github/workflows/build-robledo-kitchen-rush-threejs.yml'
  pull_request:
    paths:
      - 'juegos/robledo_kitchen_rush_3d/**'
      - '.github/workflows/build-robledo-kitchen-rush-threejs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-offline-game:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Three.js build dependencies
        working-directory: juegos/robledo_kitchen_rush_3d
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate Dynamic V4 source and mechanics
        working-directory: juegos/robledo_kitchen_rush_3d
        run: npm run check

      - name: Build single-file offline Three.js game
        working-directory: juegos/robledo_kitchen_rush_3d
        run: npm run build

      - name: Verify standalone output and embedded bundle syntax
        working-directory: juegos/robledo_kitchen_rush_3d
        run: |
          set -euxo pipefail
          test -s dist/Robledo_Kitchen_Rush_3D_DYNAMIC_V4_OFFLINE.html
          test -s dist/Robledo_Kitchen_Rush_3D_OFFLINE.html
          python - <<'PY'
          from pathlib import Path
          html = Path('dist/Robledo_Kitchen_Rush_3D_DYNAMIC_V4_OFFLINE.html').read_text(encoding='utf-8')
          assert 'ROBLEDO KITCHEN RUSH 3D' in html
          assert 'BUILD YOUR CREW' in html
          assert 'KITCHEN PLANNER' in html
          assert 'data:image/png;base64' in html
          assert 'href="./style.css"' not in html
          assert '<script src="./game.js"></script>' not in html
          assert html.count('<script') == 1, f'unexpected script openings: {html.count("<script")}'
          assert html.count('</script>') == 1, f'unexpected script closings: {html.count("</script>")}'
          start = html.index('<script>') + len('<script>')
          end = html.rindex('</script>')
          bundle = html[start:end]
          assert bundle.strip(), 'embedded game bundle is empty'
          Path('/tmp/robledo-kitchen-bundle.js').write_text(bundle, encoding='utf-8')
          print('Dynamic V4 standalone bytes:', len(html.encode('utf-8')))
          print('Embedded bundle bytes:', len(bundle.encode('utf-8')))
          PY
          node --check /tmp/robledo-kitchen-bundle.js

      - name: Real browser Dynamic V4 end-to-end test
        working-directory: juegos/robledo_kitchen_rush_3d
        run: |
          set -euxo pipefail
          CHROME_BIN="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          test -n "$CHROME_BIN"
          rm -rf /tmp/rkr-chrome-profile
          python3 -m http.server 8765 --bind 127.0.0.1 --directory dist >/tmp/rkr-http.log 2>&1 &
          HTTP_PID=$!
          xvfb-run -a "$CHROME_BIN" \
            --no-sandbox \
            --disable-dev-shm-usage \
            --no-first-run \
            --no-default-browser-check \
            --user-data-dir=/tmp/rkr-chrome-profile \
            --remote-debugging-port=9333 \
            --remote-allow-origins='*' \
            --window-size=1280,800 \
            --enable-unsafe-swiftshader \
            --use-angle=swiftshader \
            http://127.0.0.1:8765/index.html >/tmp/rkr-chrome.log 2>&1 &
          CHROME_PID=$!
          cleanup() { kill "$CHROME_PID" "$HTTP_PID" 2>/dev/null || true; }
          trap cleanup EXIT
          if ! CDP_PORT=9333 node scripts/smoke.mjs; then
            cat /tmp/rkr-chrome.log || true
            exit 1
          fi

      - name: Go 1.23
        uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false

      - name: Build portable localhost launchers
        working-directory: juegos/robledo_kitchen_rush_3d
        run: |
          set -euxo pipefail
          cp dist/Robledo_Kitchen_Rush_3D_DYNAMIC_V4_OFFLINE.html launcher/game.html
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w -H=windowsgui' -o dist/RobledoKitchenRush3D_DynamicV4_Windows.exe ./launcher
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/RobledoKitchenRush3D_DynamicV4_Linux ./launcher
          test -s dist/RobledoKitchenRush3D_DynamicV4_Windows.exe
          test -s dist/RobledoKitchenRush3D_DynamicV4_Linux

      - name: Verify portable launcher serves Dynamic V4
        working-directory: juegos/robledo_kitchen_rush_3d
        run: |
          set -euxo pipefail
          chmod +x dist/RobledoKitchenRush3D_DynamicV4_Linux
          dist/RobledoKitchenRush3D_DynamicV4_Linux --no-open --port 8766 >/tmp/rkr-launcher.log 2>&1 &
          PID=$!
          trap 'kill "$PID" 2>/dev/null || true' EXIT
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8766/__health | grep -q OK; then break; fi
            sleep .2
          done
          curl -fsS http://127.0.0.1:8766/__health | grep -q OK
          curl -fsS http://127.0.0.1:8766/ -o /tmp/rkr-served.html
          grep -q 'BUILD YOUR CREW' /tmp/rkr-served.html
          grep -q 'KITCHEN PLANNER' /tmp/rkr-served.html
          test $(wc -c </tmp/rkr-served.html) -gt 550000

      - name: Package ready-to-play Dynamic V4 plus editable source
        working-directory: juegos/robledo_kitchen_rush_3d
        run: |
          set -euxo pipefail
          rm -rf package
          mkdir -p package/Robledo_Kitchen_Rush_3D_DYNAMIC_V4/PLAY package/Robledo_Kitchen_Rush_3D_DYNAMIC_V4/SOURCE
          cp dist/RobledoKitchenRush3D_DynamicV4_Windows.exe dist/RobledoKitchenRush3D_DynamicV4_Linux dist/Robledo_Kitchen_Rush_3D_DYNAMIC_V4_OFFLINE.html dist/README_FIRST.txt package/Robledo_Kitchen_Rush_3D_DYNAMIC_V4/PLAY/
          cp index.html style.css package.json package-lock.json README.md README_DYNAMIC_V4.txt SENIOR_DYNAMIC_V4_NOTES.md go.mod package/Robledo_Kitchen_Rush_3D_DYNAMIC_V4/SOURCE/
          cp -a src scripts launcher package/Robledo_Kitchen_Rush_3D_DYNAMIC_V4/SOURCE/
          cd package
          zip -qr Robledo_Kitchen_Rush_3D_SENIOR_DYNAMIC_V4_FULL_LOCAL.zip Robledo_Kitchen_Rush_3D_DYNAMIC_V4
          test -s Robledo_Kitchen_Rush_3D_SENIOR_DYNAMIC_V4_FULL_LOCAL.zip

      - name: Upload Dynamic V4 downloadable build
        uses: actions/upload-artifact@v4
        with:
          name: Robledo-Kitchen-Rush-3D-Senior-Dynamic-V4
          path: juegos/robledo_kitchen_rush_3d/package/Robledo_Kitchen_Rush_3D_SENIOR_DYNAMIC_V4_FULL_LOCAL.zip
          if-no-files-found: error
          retention-days: 90
