name: Build Robledo Kitchen Rush Three.js

on:
  push:
    branches: [main]
    paths:
      - 'juegos/robledo_kitchen_rush_3d/**'
      - 'juegos/robledo_kitchen_rush_3d_staging/**'
      - '.github/workflows/build-robledo-kitchen-rush-threejs.yml'
  pull_request:
    paths:
      - 'juegos/robledo_kitchen_rush_3d/**'
      - 'juegos/robledo_kitchen_rush_3d_staging/**'
      - '.github/workflows/build-robledo-kitchen-rush-threejs.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-offline-game:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Expand staged full game source
        run: |
          set -euxo pipefail
          if [ -f juegos/robledo_kitchen_rush_3d_staging/apply_payload.py ]; then
            python juegos/robledo_kitchen_rush_3d_staging/apply_payload.py
          fi
          test -s juegos/robledo_kitchen_rush_3d/src/game.js
          test -s juegos/robledo_kitchen_rush_3d/package.json

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pinned Three.js build dependencies
        working-directory: juegos/robledo_kitchen_rush_3d
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Validate source and core mechanics
        working-directory: juegos/robledo_kitchen_rush_3d
        run: npm run check

      - name: Build single-file offline Three.js game
        working-directory: juegos/robledo_kitchen_rush_3d
        run: npm run build

      - name: Verify standalone output
        working-directory: juegos/robledo_kitchen_rush_3d
        run: |
          set -euxo pipefail
          test -s dist/Robledo_Kitchen_Rush_3D_OFFLINE.html
          grep -q 'ROBLEDO KITCHEN RUSH 3D' dist/Robledo_Kitchen_Rush_3D_OFFLINE.html
          grep -q 'data:image/png;base64' dist/Robledo_Kitchen_Rush_3D_OFFLINE.html
          ! grep -q 'src="./game.js"' dist/Robledo_Kitchen_Rush_3D_OFFLINE.html
          ! grep -q 'href="./style.css"' dist/Robledo_Kitchen_Rush_3D_OFFLINE.html
          du -h dist/Robledo_Kitchen_Rush_3D_OFFLINE.html

      - name: Package ready-to-play game plus editable source
        working-directory: juegos/robledo_kitchen_rush_3d
        run: |
          set -euxo pipefail
          rm -rf package
          mkdir -p package/Robledo_Kitchen_Rush_3D/PLAY package/Robledo_Kitchen_Rush_3D/SOURCE
          cp dist/Robledo_Kitchen_Rush_3D_OFFLINE.html dist/README_FIRST.txt package/Robledo_Kitchen_Rush_3D/PLAY/
          cp index.html style.css package.json package-lock.json README.md package/Robledo_Kitchen_Rush_3D/SOURCE/
          cp -a src scripts package/Robledo_Kitchen_Rush_3D/SOURCE/
          cd package
          zip -qr Robledo_Kitchen_Rush_3D_FULL_LOCAL.zip Robledo_Kitchen_Rush_3D
          test -s Robledo_Kitchen_Rush_3D_FULL_LOCAL.zip

      - name: Upload downloadable full local game
        uses: actions/upload-artifact@v4
        with:
          name: Robledo-Kitchen-Rush-3D-Full-Local
          path: juegos/robledo_kitchen_rush_3d/package/Robledo_Kitchen_Rush_3D_FULL_LOCAL.zip
          if-no-files-found: error
          retention-days: 90

      - name: Commit expanded editable source to main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('juegos/robledo_kitchen_rush_3d_staging/apply_payload.py') != ''
        run: |
          set -euxo pipefail
          rm -rf juegos/robledo_kitchen_rush_3d_staging
          rm -rf juegos/robledo_kitchen_rush_3d/node_modules juegos/robledo_kitchen_rush_3d/dist juegos/robledo_kitchen_rush_3d/package
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add juegos/robledo_kitchen_rush_3d juegos/robledo_kitchen_rush_3d_staging
          git commit -m "Expand Robledo Kitchen Rush Three.js full source"
          git push
