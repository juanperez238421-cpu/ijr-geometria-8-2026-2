name: Apply and Package Robledo Bistro 3D Senior

on:
  push:
    branches: [main]
    paths:
      - 'juegos/gestion/**'
      - 'assets/logo_colegio_transparente.png'
      - '.github/workflows/package-management-game.yml'
  pull_request:
    paths:
      - 'juegos/gestion/**'
      - 'assets/logo_colegio_transparente.png'
      - '.github/workflows/package-management-game.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  upgrade-and-package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate pull-request JavaScript
        if: github.event_name == 'pull_request'
        run: node --check juegos/gestion/game.js

      - name: Apply Senior V2 payload and commit generated source
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          if [ -f juegos/gestion/apply_senior_v2.py ]; then
            python juegos/gestion/apply_senior_v2.py
            rm -rf juegos/gestion/.senior_payload
            rm -f juegos/gestion/apply_senior_v2.py
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Apply Robledo Bistro 3D Senior V2 source"
            git push
          fi

      - name: Validate Senior JavaScript
        if: github.event_name == 'push'
        run: node --check juegos/gestion/game.js

      - name: Build Senior standalone package
        if: github.event_name == 'push'
        run: python juegos/gestion/build_offline.py

      - name: Verify Senior package
        if: github.event_name == 'push'
        run: |
          test -s dist/Robledo_Bistro_3D_SENIOR_OFFLINE.html
          test -s dist/Robledo_Bistro_3D_SENIOR_OFFLINE_Package.zip
          python - <<'PY'
          from pathlib import Path
          html = Path('dist/Robledo_Bistro_3D_SENIOR_OFFLINE.html').read_text(encoding='utf-8')
          assert 'href="style.css"' not in html
          assert 'src="game.js"' not in html
          assert 'data:image/png;base64,' in html
          assert 'data:image/svg+xml;base64,' in html
          assert 'Robledo Bistro 3D Senior' in html
          print('Senior package verified')
          PY

      - name: Upload downloadable game
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: Robledo-Bistro-3D-Senior-Offline
          path: |
            dist/Robledo_Bistro_3D_SENIOR_OFFLINE.html
            dist/Robledo_Bistro_3D_SENIOR_OFFLINE_Package.zip
            dist/LEEME.txt
          if-no-files-found: error
          retention-days: 90
