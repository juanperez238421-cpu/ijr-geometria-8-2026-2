name: Package Robledo Bistro 3D Offline

on:
  push:
    branches: [main]
    paths:
      - 'juegos/gestion/**'
      - 'assets/logo_colegio_transparente.png'
      - '.github/workflows/package-management-game.yml'
  pull_request:
    paths:
      - 'juegos/gestion/**'
      - 'assets/logo_colegio_transparente.png'
      - '.github/workflows/package-management-game.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate game JavaScript
        run: node --check juegos/gestion/game.js

      - name: Build standalone offline package
        run: python juegos/gestion/build_offline.py

      - name: Verify package
        run: |
          test -s dist/Robledo_Bistro_3D_OFFLINE.html
          test -s dist/Robledo_Bistro_3D_OFFLINE_Package.zip
          python - <<'PY'
          from pathlib import Path
          html = Path('dist/Robledo_Bistro_3D_OFFLINE.html').read_text(encoding='utf-8')
          assert 'href="style.css"' not in html
          assert 'src="game.js"' not in html
          assert 'data:image/png;base64,' in html
          assert '<script>' in html and '<style>' in html
          assert 'Robledo Bistro 3D' in html
          assert 'gameCanvas' in html
          print('Robledo Bistro 3D standalone HTML verification passed.')
          PY

      - name: Upload downloadable game
        uses: actions/upload-artifact@v4
        with:
          name: Robledo-Bistro-3D-Offline
          path: |
            dist/Robledo_Bistro_3D_OFFLINE.html
            dist/Robledo_Bistro_3D_OFFLINE_Package.zip
            dist/LEEME.txt
          if-no-files-found: error
          retention-days: 90
