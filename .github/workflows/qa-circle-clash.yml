name: QA · Circle Clash Arena

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'juegos/circle-clash/**'
      - '.github/workflows/qa-circle-clash.yml'
  push:
    branches: [main]
    paths:
      - 'juegos/circle-clash/**'
      - '.github/workflows/qa-circle-clash.yml'

permissions:
  contents: read

concurrency:
  group: circle-clash-qa-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Static architecture QA
        run: node juegos/circle-clash/qa/static.mjs

      - name: Live Supabase integration QA
        run: node juegos/circle-clash/qa/integration.mjs
