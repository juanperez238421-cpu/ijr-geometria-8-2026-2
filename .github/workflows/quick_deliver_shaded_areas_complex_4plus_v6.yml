name: Quick Deliver Geometry8 Complex 4Plus V6

on:
  push:
    branches:
      - temp/shaded-areas-class2-complex-4plus-v6-delivery-20260929
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          python -m py_compile             Geometry8_Shaded_Areas_Mixed_Basics_V2.py             Geometry8_Shaded_Areas_Opus55_V3.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V1.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V3.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V4_QA_FIXED.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py             Geometry8_Shaded_Areas_Class2_Complex_4Plus_V6.py

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: Render PQH
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          docker run --rm             --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=1.0             -v "$PWD:/manim"             -w /manim             --entrypoint bash             manimcommunity/manim:v0.20.1             -c "set -euo pipefail;                 mkdir -p /tmp/bin;                 printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open;                 chmod +x /tmp/bin/xdg-open;                 export PATH=/tmp/bin:\$PATH;                 manim -pqh                   Geometry8_Shaded_Areas_Class2_Complex_4Plus_V6.py                   Geometry8ShadedAreasClass2Complex4PlusV6                   --format=mp4                   --disable_caching"

      - name: Stage video
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          RAW="$(find media -type f -name 'Geometry8ShadedAreasClass2Complex4PlusV6.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW"
          test -s "$RAW"
          mkdir -p quick_delivery
          cp "$RAW" quick_delivery/Geometry8_Shaded_Areas_Class2_Complex_4Plus_V6_FINAL_pqh.mp4
          ls -lh quick_delivery/

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-complex-4plus-v6-video
          path: manim_lessons/shaded_areas_first_steps/quick_delivery/Geometry8_Shaded_Areas_Class2_Complex_4Plus_V6_FINAL_pqh.mp4
          if-no-files-found: error
          retention-days: 14
