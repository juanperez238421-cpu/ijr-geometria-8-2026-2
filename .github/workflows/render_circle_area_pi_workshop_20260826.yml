name: Render Geometry8 Circle Area + Pi Workshop PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python sources
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          python -m py_compile \
            circle_classroom_style.py \
            Geometry8_Circle_Area_Visual_Derivation.py \
            Geometry8_Circle_Pi_Mixed_Workshop.py

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL visual smoke test — both presentations
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          for ITEM in \
            'Geometry8_Circle_Area_Visual_Derivation.py Geometry8CircleAreaVisualDerivation' \
            'Geometry8_Circle_Pi_Mixed_Workshop.py Geometry8CirclePiMixedWorkshop'
          do
            set -- $ITEM
            FILE="$1"
            SCENE="$2"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=0.10 \
              -v "$PWD:/manim" \
              -v /tmp/manim-bin:/tmp/manim-bin:ro \
              -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pql "$1" "$2" --format=mp4 --disable_caching' _ "$FILE" "$SCENE"
          done

      - name: Final literal PQH render — Circle Area
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf final_media_area
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pqh Geometry8_Circle_Area_Visual_Derivation.py Geometry8CircleAreaVisualDerivation --format=mp4 --disable_caching --fps 30 --resolution 1920,1080 --media_dir final_media_area'

      - name: Final literal PQH render — Pi Mixed Workshop
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf final_media_mixed
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pqh Geometry8_Circle_Pi_Mixed_Workshop.py Geometry8CirclePiMixedWorkshop --format=mp4 --disable_caching --fps 30 --resolution 1920,1080 --media_dir final_media_mixed'

      - name: Verify, checksum and build two-video ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf delivery
          mkdir -p delivery

          AREA_SRC="$(find final_media_area -type f -name 'Geometry8CircleAreaVisualDerivation.mp4' -print -quit)"
          MIXED_SRC="$(find final_media_mixed -type f -name 'Geometry8CirclePiMixedWorkshop.mp4' -print -quit)"
          test -n "$AREA_SRC"
          test -n "$MIXED_SRC"
          test -s "$AREA_SRC"
          test -s "$MIXED_SRC"

          AREA_OUT='delivery/Geometry8_Circle_Area_Visual_Derivation_FINAL_pqh.mp4'
          MIXED_OUT='delivery/Geometry8_Circle_Pi_Mixed_Workshop_FINAL_pqh.mp4'
          ZIP_OUT='delivery/Geometry8_Circle_Area_and_Pi_PQH.zip'
          cp "$AREA_SRC" "$AREA_OUT"
          cp "$MIXED_SRC" "$MIXED_OUT"

          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg zip
          fi

          for VIDEO in "$AREA_OUT" "$MIXED_OUT"; do
            PROBE="${VIDEO%.mp4}_ffprobe.json"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
              -of json "$VIDEO" > "$PROBE"
            cat "$PROBE"
            python3 - "$VIDEO" "$PROBE" <<'PY'
          import json
          import sys
          from fractions import Fraction

          video, probe_path = sys.argv[1:3]
          with open(probe_path, encoding='utf-8') as fh:
              data = json.load(fh)
          streams = data.get('streams') or []
          if len(streams) != 1:
              raise SystemExit(f'{video}: expected exactly one selected video stream')
          stream = streams[0]
          assert int(stream['width']) == 1920, (video, stream)
          assert int(stream['height']) == 1080, (video, stream)
          assert Fraction(stream['r_frame_rate']) == 30, (video, stream)
          assert stream['codec_name'] == 'h264', (video, stream)
          assert stream['pix_fmt'] == 'yuv420p', (video, stream)
          print(f"VERIFIED {video}: 1920x1080, 30 fps, H.264, yuv420p")
          PY
            ffmpeg -v error -i "$VIDEO" -f null -
          done

          zip -j "$ZIP_OUT" "$AREA_OUT" "$MIXED_OUT"
          test -s "$ZIP_OUT"
          sha256sum "$AREA_OUT" "$MIXED_OUT" "$ZIP_OUT" > delivery/SHA256SUMS.txt
          cp Geometry8_Circle_Area_Visual_Derivation.py delivery/
          cp Geometry8_Circle_Pi_Mixed_Workshop.py delivery/
          cp circle_classroom_style.py delivery/
          ls -lh delivery
          unzip -l "$ZIP_OUT"

      - name: Upload verified presentation package
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-circle-area-pi-workshop-pqh
          path: manim_circle_20260826/delivery/
          if-no-files-found: error
