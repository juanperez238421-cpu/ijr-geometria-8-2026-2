name: Render Geometry8 Circle 3D-to-2D Projection Workshop PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

concurrency:
  group: geometry8-circle-projection-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python sources
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          python -m py_compile \
            circle_classroom_style.py \
            Geometry8_Circle_Pi_Mixed_Workshop.py \
            Geometry8_Circle_Projection_Workshop.py \
            Geometry8_Circle_Projection_Workshop_Final.py

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL visual smoke test
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pql Geometry8_Circle_Projection_Workshop_Final.py Geometry8CircleProjectionWorkshopFinal --format=mp4 --disable_caching'

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf final_media_projection
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pqh Geometry8_Circle_Projection_Workshop_Final.py Geometry8CircleProjectionWorkshopFinal --format=mp4 --disable_caching --fps 30 --resolution 1920,1080 --media_dir final_media_projection'

      - name: Verify, decode, checksum and package
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf delivery_projection
          mkdir -p delivery_projection

          SRC="$(find final_media_projection -type f -name 'Geometry8CircleProjectionWorkshopFinal.mp4' -print -quit)"
          test -n "$SRC"
          test -s "$SRC"
          OUT='delivery_projection/Geometry8_Circle_Projection_Workshop_FINAL_pqh.mp4'
          ZIP='delivery_projection/Geometry8_Circle_Projection_Workshop_PQH.zip'
          cp "$SRC" "$OUT"

          if ! command -v ffprobe >/dev/null 2>&1 || ! command -v ffmpeg >/dev/null 2>&1 || ! command -v zip >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg zip
          fi

          PROBE='delivery_projection/Geometry8_Circle_Projection_Workshop_FINAL_pqh_ffprobe.json'
          ffprobe -v error -select_streams v:0 \
            -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
            -of json "$OUT" > "$PROBE"
          cat "$PROBE"
          python3 - "$OUT" "$PROBE" <<'PY'
          import json
          import sys
          from fractions import Fraction
          video, probe = sys.argv[1:3]
          with open(probe, encoding='utf-8') as fh:
              data = json.load(fh)
          streams = data.get('streams') or []
          if len(streams) != 1:
              raise SystemExit(f'{video}: expected exactly one selected video stream')
          s = streams[0]
          assert int(s['width']) == 1920, s
          assert int(s['height']) == 1080, s
          assert Fraction(s['r_frame_rate']) == 30, s
          assert s['codec_name'] == 'h264', s
          assert s['pix_fmt'] == 'yuv420p', s
          print(f'VERIFIED {video}: 1920x1080, 30 fps, H.264, yuv420p')
          PY
          ffmpeg -v error -i "$OUT" -f null -

          cp Geometry8_Circle_Projection_Workshop.py delivery_projection/
          cp Geometry8_Circle_Projection_Workshop_Final.py delivery_projection/
          cp Geometry8_Circle_Pi_Mixed_Workshop.py delivery_projection/
          cp circle_classroom_style.py delivery_projection/
          zip -j "$ZIP" "$OUT" delivery_projection/Geometry8_Circle_Projection_Workshop.py delivery_projection/Geometry8_Circle_Projection_Workshop_Final.py
          test -s "$ZIP"
          sha256sum "$OUT" "$ZIP" > delivery_projection/SHA256SUMS.txt
          ls -lh delivery_projection

      - name: Upload verified projection workshop
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-circle-projection-workshop-pqh
          path: manim_circle_20260826/delivery_projection/
          if-no-files-found: error
