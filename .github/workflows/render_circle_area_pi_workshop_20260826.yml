name: Render Geometry8 Circle Area + Pi Workshop PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python sources
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          python -m py_compile \
            circle_classroom_style.py \
            Geometry8_Circle_Area_Visual_Derivation.py \
            Geometry8_Circle_Pi_Mixed_Workshop.py

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL visual smoke test — both presentations
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          for ITEM in \
            'Geometry8_Circle_Area_Visual_Derivation.py Geometry8CircleAreaVisualDerivation' \
            'Geometry8_Circle_Pi_Mixed_Workshop.py Geometry8CirclePiMixedWorkshop'
          do
            set -- $ITEM
            FILE="$1"
            SCENE="$2"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE=0.10 \
              -v "$PWD:/manim" \
              -v /tmp/manim-bin:/tmp/manim-bin:ro \
              -w /manim \
              --entrypoint bash \
              manimcommunity/manim:v0.20.1 \
              -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pql "$1" "$2" --format=mp4 --disable_caching' _ "$FILE" "$SCENE"
          done

      - name: Final literal PQH render — Circle Area
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pqh Geometry8_Circle_Area_Visual_Derivation.py Geometry8CircleAreaVisualDerivation --format=mp4 --disable_caching --fps 30 --resolution 1920,1080'

      - name: Final literal PQH render — Pi Mixed Workshop
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pqh Geometry8_Circle_Pi_Mixed_Workshop.py Geometry8CirclePiMixedWorkshop --format=mp4 --disable_caching --fps 30 --resolution 1920,1080'

      - name: Verify and stage delivery
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p delivery
          AREA_SRC="$(find media -type f -name 'Geometry8CircleAreaVisualDerivation.mp4' | sort | tail -n 1)"
          MIXED_SRC="$(find media -type f -name 'Geometry8CirclePiMixedWorkshop.mp4' | sort | tail -n 1)"
          test -n "$AREA_SRC"
          test -n "$MIXED_SRC"
          cp "$AREA_SRC" delivery/Geometry8_Circle_Area_Visual_Derivation_FINAL_pqh.mp4
          cp "$MIXED_SRC" delivery/Geometry8_Circle_Pi_Mixed_Workshop_FINAL_pqh.mp4
          cp Geometry8_Circle_Area_Visual_Derivation.py delivery/
          cp Geometry8_Circle_Pi_Mixed_Workshop.py delivery/
          cp circle_classroom_style.py delivery/
          for VIDEO in delivery/*.mp4; do
            test -s "$VIDEO"
            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate \
              -of default=noprint_wrappers=1 "$VIDEO" | tee "${VIDEO%.mp4}_ffprobe.txt"
            ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$VIDEO" | grep -qx '1920'
            ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$VIDEO" | grep -qx '1080'
            ffprobe -v error -select_streams v:0 -show_entries stream=r_frame_rate -of csv=p=0 "$VIDEO" | grep -Eq '^(30/1|60/2)$'
            ffmpeg -v error -i "$VIDEO" -f null -
          done
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          ls -lh delivery

      - name: Upload verified presentation package
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-circle-area-pi-workshop-pqh
          path: manim_circle_20260826/delivery/
          if-no-files-found: error
