name: Render Geometry 8 Pre-Exam Workshop

on:
  pull_request:
    branches:
      - main
    paths:
      - "manim/pre_exam_2026_08_03/**"
      - ".github/workflows/render_geometry8_pre_exam.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore readable Manim source
        shell: bash
        run: |
          set -euo pipefail
          SRC_DIR="manim/pre_exam_2026_08_03"
          base64 -d "$SRC_DIR/geometry8_pre_exam_workshop.py.gz.b64" | gzip -d > "$SRC_DIR/geometry8_pre_exam_workshop.py"
          python -m py_compile "$SRC_DIR/geometry8_pre_exam_workshop.py"
          test -s "$SRC_DIR/geometry8_pre_exam_workshop.py"

      - name: Pull ManimCE 0.20.1
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Low-quality validation renders
        shell: bash
        run: |
          set -euo pipefail
          SRC="manim/pre_exam_2026_08_03/geometry8_pre_exam_workshop.py"
          for SCENE in Geometry8_PreExam_Workshop_Problems Geometry8_PreExam_Workshop_Solutions; do
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -v "$PWD:/manim" \
              -w /manim \
              manimcommunity/manim:v0.20.1 \
              manim -ql "$SRC" "$SCENE" --format=mp4 --disable_caching
          done

      - name: High-quality final renders
        shell: bash
        run: |
          set -euo pipefail
          SRC="manim/pre_exam_2026_08_03/geometry8_pre_exam_workshop.py"

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            manimcommunity/manim:v0.20.1 \
            manim -qh "$SRC" Geometry8_PreExam_Workshop_Problems \
              --format=mp4 --disable_caching \
              --output_file Geometry8_PreExam_Workshop_Problems_1080p \
              2>&1 | tee render_problems.log

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            manimcommunity/manim:v0.20.1 \
            manim -qh "$SRC" Geometry8_PreExam_Workshop_Solutions \
              --format=mp4 --disable_caching \
              --output_file Geometry8_PreExam_Workshop_Solutions_1080p \
              2>&1 | tee render_solutions.log

      - name: Collect and verify delivery files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery

          echo "All rendered MP4 files:"
          find media -type f -name '*.mp4' -printf '%s %p\n' | sort -nr

          problems_file="$(find media -type f -name 'Geometry8_PreExam_Workshop_Problems_1080p.mp4' -print -quit)"
          solutions_file="$(find media -type f -name 'Geometry8_PreExam_Workshop_Solutions_1080p.mp4' -print -quit)"

          if [ -z "$problems_file" ]; then
            problems_file="$(find media -type f -name '*Problems*.mp4' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi
          if [ -z "$solutions_file" ]; then
            solutions_file="$(find media -type f -name '*Solutions*.mp4' -printf '%s %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          fi

          test -n "$problems_file"
          test -n "$solutions_file"
          test -s "$problems_file"
          test -s "$solutions_file"

          cp "$problems_file" delivery/Geometry8_PreExam_Workshop_Problems_1080p.mp4
          cp "$solutions_file" delivery/Geometry8_PreExam_Workshop_Solutions_1080p.mp4
          cp manim/pre_exam_2026_08_03/geometry8_pre_exam_workshop.py delivery/
          cp render_problems.log render_solutions.log delivery/

          for item in Problems Solutions; do
            file="delivery/Geometry8_PreExam_Workshop_${item}_1080p.mp4"
            probe="delivery/${item,,}_ffprobe.txt"

            ffprobe -v error -select_streams v:0 \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$file" | tee "$probe"

            width="$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 "$file")"
            height="$(ffprobe -v error -select_streams v:0 -show_entries stream=height -of csv=p=0 "$file")"
            duration="$(ffprobe -v error -show_entries format=duration -of csv=p=0 "$file")"

            test "$width" = "1920"
            test "$height" = "1080"
            awk -v d="$duration" 'BEGIN { exit !(d > 1.0) }'
          done

          sha256sum delivery/*.mp4 delivery/*.py > delivery/SHA256SUMS.txt

      - name: Upload rendered package
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-pre-exam-workshop-rendered
          path: delivery/
          if-no-files-found: error
          retention-days: 14
