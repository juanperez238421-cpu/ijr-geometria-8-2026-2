name: Render Geometry8 Week3 Circle V4 FINAL Delivery

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render-v4-final:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct exact audited V4 source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_v4
          cat manim_week3_v3_payload/payload.part* | base64 -d > render_v4/v3_payload.tar.gz
          cd render_v4
          tar -xzf v3_payload.tar.gz

          python - <<'PY'
          from pathlib import Path
          p = Path('Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py')
          s = p.read_text(encoding='utf-8')
          for old, new in [
              ('r"\\boxed{C=\\pi d}"', 'r"C=\\pi d"'),
              ('r"\\boxed{C=2\\pi r}"', 'r"C=2\\pi r"'),
              ('Geometry8Week3CircleTheorySeniorV3 --format',
               'Geometry8Week3CircleTheorySeniorV3Final --format'),
          ]:
              if old in s:
                  s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')
          PY

          test "$(sha256sum Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py | awk '{print $1}')" = "ca23df3ff204d5c445ab5633e07a04ebd885d4090ba3c0e8aece3dea5cad645a"
          patch --batch -p0 < ../manim_week3_circle_v4/v3_to_v4_relative.patch
          mv Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py Geometry8_Week3_Class1_CircleTheory_Senior_V4_FINAL.py

          python -m py_compile Geometry8_Week3_Class1_CircleTheory_Senior_V4_FINAL.py jp_classroom_style.py
          test "$(sha256sum Geometry8_Week3_Class1_CircleTheory_Senior_V4_FINAL.py | awk '{print $1}')" = "5f30e8b3e4f741373f7e2358386a03b11841baea8c9973e2f0a256d5a39b87b7"
          test "$(sha256sum jp_classroom_style.py | awk '{print $1}')" = "75ebb3b37b8b925ddf87ef0256c63e8c47a5f014f549f0330d600f540361921a"

      - name: Pull official ManimCE 0.20.1 image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL layout QA
        shell: bash
        run: |
          set -euo pipefail
          cd render_v4
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.04 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/colab-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH=/tmp/colab-bin:\$PATH; manim -pql Geometry8_Week3_Class1_CircleTheory_Senior_V4_FINAL.py Geometry8Week3CircleTheorySeniorV4Final --format=mp4 --disable_caching" \
            2>&1 | tee render_circle_v4_pql.log

      - name: Full literal -pqh production render
        shell: bash
        run: |
          set -euo pipefail
          cd render_v4
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/colab-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH=/tmp/colab-bin:\$PATH; manim -pqh Geometry8_Week3_Class1_CircleTheory_Senior_V4_FINAL.py Geometry8Week3CircleTheorySeniorV4Final --format=mp4 --disable_caching" \
            2>&1 | tee render_circle_v4_pqh.log

      - name: Stage final MP4
        shell: bash
        run: |
          set -euo pipefail
          cd render_v4
          RAW="$(find media -type f -path '*/1080p30/*' -name 'Geometry8Week3CircleTheorySeniorV4Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW" && test -s "$RAW"
          mkdir -p delivery
          FINAL="delivery/Geometry8_Week3_Class1_CircleTheory_Senior_V4_FINAL_pqh.mp4"
          cp "$RAW" "$FINAL"
          python - <<'PY'
          from pathlib import Path
          p = Path('delivery/Geometry8_Week3_Class1_CircleTheory_Senior_V4_FINAL_pqh.mp4')
          header = p.read_bytes()[:32]
          assert len(header) >= 12 and header[4:8] == b'ftyp', 'Invalid MP4 signature'
          assert p.stat().st_size > 100000, 'MP4 unexpectedly small'
          print(f'Final MP4 ready: {p.stat().st_size} bytes')
          PY
          sha256sum "$FINAL" > delivery/SHA256SUMS.txt

      - name: Upload final MP4 artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-week3-circle-v4-final
          path: render_v4/delivery/
          if-no-files-found: error
          retention-days: 7
