name: Render Geometry8 Shaded Areas Class2 Complex V5 Final

on:
  push:
    branches:
      - temp/shaded-areas-class2-complex-v5-final-20260928
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source hierarchy and V5
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps

          python -m py_compile \
            Geometry8_Shaded_Areas_Mixed_Basics_V2.py \
            Geometry8_Shaded_Areas_Opus55_V3.py \
            Geometry8_Shaded_Areas_Class2_Complex_Opus55_V1.py \
            Geometry8_Shaded_Areas_Class2_Complex_Opus55_V3.py \
            Geometry8_Shaded_Areas_Class2_Complex_Opus55_V4_QA_FIXED.py \
            Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py

          grep -n "class Geometry8ShadedAreasClass2ComplexOpus55V5Final" \
            Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py

          sha256sum Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py \
            | tee source_sha256.txt

      - name: Pull exact ManimCE 0.20.1 image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL structural and geometry QA
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.05 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; \
                mkdir -p /tmp/bin; \
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; \
                chmod +x /tmp/bin/xdg-open; \
                export PATH=/tmp/bin:\$PATH; \
                manim -pql \
                  Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py \
                  Geometry8ShadedAreasClass2ComplexOpus55V5Final \
                  --format=mp4 \
                  --disable_caching" \
            2>&1 | tee render_pql.log

      - name: Full literal PQH production render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps

          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; \
                mkdir -p /tmp/bin; \
                printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; \
                chmod +x /tmp/bin/xdg-open; \
                export PATH=/tmp/bin:\$PATH; \
                manim -pqh \
                  Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py \
                  Geometry8ShadedAreasClass2ComplexOpus55V5Final \
                  --format=mp4 \
                  --disable_caching" \
            2>&1 | tee render_pqh.log

      - name: Install media QA tooling
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet pillow

      - name: Verify MP4, full decode, and extract frame-exact QA
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps

          RAW="$(find media -type f \
            -name 'Geometry8ShadedAreasClass2ComplexOpus55V5Final.mp4' \
            -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"

          test -n "$RAW"
          test -s "$RAW"

          OUT="delivery_v5"
          FINAL="$OUT/Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL_pqh.mp4"

          rm -rf "$OUT"
          mkdir -p \
            "$OUT/qa_frames/broad" \
            "$OUT/qa_frames/events" \
            "$OUT/qa_contact_sheets"

          cp "$RAW" "$FINAL"
          cp Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py "$OUT/"
          cp render_pql.log render_pqh.log source_sha256.txt "$OUT/"

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            "$FINAL" | tee "$OUT/FFPROBE.txt"

          grep -q '^codec_name=h264$' "$OUT/FFPROBE.txt"
          grep -q '^width=1920$' "$OUT/FFPROBE.txt"
          grep -q '^height=1080$' "$OUT/FFPROBE.txt"
          grep -q '^r_frame_rate=30/1$' "$OUT/FFPROBE.txt"
          grep -q '^pix_fmt=yuv420p$' "$OUT/FFPROBE.txt"

          # Mandatory sequential decode of the COMPLETE final video.
          ffmpeg -v error -i "$FINAL" -f null -

          # Broad sampling across the ENTIRE video, approximately every 10 s.
          ffmpeg -hide_banner -loglevel error \
            -i "$FINAL" \
            -vf "fps=1/10,scale=640:-1" \
            "$OUT/qa_frames/broad/frame_%03d.jpg"

          # Parse scene-generated event timestamps from the FULL PQH render log.
          grep 'QA_EVENT|' render_pqh.log \
            | sed -E 's/.*(QA_EVENT\|[^[:space:]]+).*/\1/' \
            | tee "$OUT/QA_EVENTS.txt"

          EVENT_COUNT="$(wc -l < "$OUT/QA_EVENTS.txt")"
          test "$EVENT_COUNT" -ge 25

          python - "$OUT/QA_EVENTS.txt" <<'PY'
          import sys
          from pathlib import Path

          lines = [x.strip() for x in Path(sys.argv[1]).read_text().splitlines() if x.strip()]
          times = [float(x.rsplit("|", 1)[1]) for x in lines]
          assert len(times) >= 25, len(times)
          assert max(times) > 300, max(times)
          assert all(b >= a for a, b in zip(times, times[1:])), "QA event timestamps are not monotonic"
          print(f"QA event timeline PASS: {len(times)} events, max={max(times):.3f}s")
          PY

          while IFS='|' read -r prefix problem label ts; do
            test "$prefix" = "QA_EVENT"
            ffmpeg -hide_banner -loglevel error \
              -ss "$ts" -i "$FINAL" \
              -frames:v 1 \
              -vf "scale=960:-1" \
              "$OUT/qa_frames/events/${problem}__${label}.jpg"
          done < "$OUT/QA_EVENTS.txt"

          sha256sum \
            "$FINAL" \
            "$OUT/Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py" \
            > "$OUT/SHA256SUMS.txt"

          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "actions_run_id=${GITHUB_RUN_ID}"
            echo "actions_run_number=${GITHUB_RUN_NUMBER}"
            echo "workflow=${GITHUB_WORKFLOW}"
            echo "artifact_name=geometry8-shaded-areas-class2-complex-v5-final"
            echo "manim_image=manimcommunity/manim:v0.20.1"
            echo "preview_time_scale=0.05"
            echo "production_time_scale=1.0"
          } > "$OUT/RUN_METADATA.txt"

      - name: Build visual QA contact sheets
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps

          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path("delivery_v5")
          broad_dir = root / "qa_frames" / "broad"
          event_dir = root / "qa_frames" / "events"
          sheets = root / "qa_contact_sheets"

          def make_sheet(paths, out, cols=4, thumb=(440, 248), label_height=34):
              paths = list(paths)
              assert paths, f"No images for {out}"
              cells = []
              for p in paths:
                  img = Image.open(p).convert("RGB")
                  img.thumbnail(thumb)
                  canvas = Image.new("RGB", (thumb[0] + 20, thumb[1] + label_height), "white")
                  canvas.paste(img, ((canvas.width - img.width)//2, 4))
                  draw = ImageDraw.Draw(canvas)
                  draw.text((8, thumb[1] + 8), p.stem, fill="black")
                  cells.append(canvas)

              rows = (len(cells) + cols - 1) // cols
              sheet = Image.new(
                  "RGB",
                  (cols * cells[0].width, rows * cells[0].height),
                  (235, 235, 235),
              )
              for i, cell in enumerate(cells):
                  sheet.paste(cell, ((i % cols) * cell.width, (i // cols) * cell.height))
              sheet.save(out, quality=92)

          make_sheet(
              sorted(broad_dir.glob("*.jpg")),
              sheets / "00_broad_sampling_entire_video.jpg",
              cols=4,
          )

          for problem in ("facade", "parallelogram", "stadium", "hexagon", "capstone"):
              frames = sorted(event_dir.glob(f"{problem}__*.jpg"))
              make_sheet(
                  frames,
                  sheets / f"{problem}_event_QA.jpg",
                  cols=3,
                  thumb=(560, 315),
                  label_height=38,
              )

          print("Contact sheets:", *sorted(str(p) for p in sheets.glob("*.jpg")), sep="\n")
          PY

      - name: Upload validated final QA package
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-shaded-areas-class2-complex-v5-final
          path: manim_lessons/shaded_areas_first_steps/delivery_v5/
          if-no-files-found: error
          retention-days: 14
