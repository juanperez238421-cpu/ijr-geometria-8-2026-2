name: Render Geometry8 Shaded Areas Class2 Opus55 V3

on:
  push:
    branches:
      - temp/shaded-areas-class2-opus55-v3-20260927
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          python -m py_compile Geometry8_Shaded_Areas_Class2_Opus55_V3.py
          grep -n "class Geometry8ShadedAreasClass2Opus55V3" Geometry8_Shaded_Areas_Class2_Opus55_V3.py
          sha256sum Geometry8_Shaded_Areas_Class2_Opus55_V3.py | tee source_sha256.txt

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL structural QA
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.05 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH=/tmp/bin:\$PATH; manim -pql Geometry8_Shaded_Areas_Class2_Opus55_V3.py Geometry8ShadedAreasClass2Opus55V3 --format=mp4 --disable_caching" \
            2>&1 | tee render_pql.log

      - name: Full PQH production render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH=/tmp/bin:\$PATH; manim -pqh Geometry8_Shaded_Areas_Class2_Opus55_V3.py Geometry8ShadedAreasClass2Opus55V3 --format=mp4 --disable_caching" \
            2>&1 | tee render_pqh.log

      - name: Media QA and sampled frames
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          cd manim_lessons/shaded_areas_first_steps

          RAW="$(find media -type f -name 'Geometry8ShadedAreasClass2Opus55V3.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW"
          test -s "$RAW"

          mkdir -p delivery_class2_v3/qa_frames
          cp "$RAW" delivery_class2_v3/Geometry8_Shaded_Areas_Class2_Opus55_V3_FINAL_pqh.mp4
          cp Geometry8_Shaded_Areas_Class2_Opus55_V3.py delivery_class2_v3/
          cp render_pql.log render_pqh.log source_sha256.txt delivery_class2_v3/

          ffprobe -v error \
            -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
            -show_entries format=duration,size \
            -of default=noprint_wrappers=1 \
            delivery_class2_v3/Geometry8_Shaded_Areas_Class2_Opus55_V3_FINAL_pqh.mp4 \
            | tee delivery_class2_v3/FFPROBE.txt

          grep -q '^codec_name=h264$' delivery_class2_v3/FFPROBE.txt
          grep -q '^width=1920$' delivery_class2_v3/FFPROBE.txt
          grep -q '^height=1080$' delivery_class2_v3/FFPROBE.txt
          grep -q '^r_frame_rate=30/1$' delivery_class2_v3/FFPROBE.txt
          grep -q '^pix_fmt=yuv420p$' delivery_class2_v3/FFPROBE.txt

          ffmpeg -v error -i delivery_class2_v3/Geometry8_Shaded_Areas_Class2_Opus55_V3_FINAL_pqh.mp4 -f null -

          ffmpeg -v error \
            -i delivery_class2_v3/Geometry8_Shaded_Areas_Class2_Opus55_V3_FINAL_pqh.mp4 \
            -vf "fps=1/20,scale=960:-1" \
            -frames:v 24 delivery_class2_v3/qa_frames/frame_%02d.jpg

          sha256sum delivery_class2_v3/Geometry8_Shaded_Areas_Class2_Opus55_V3_FINAL_pqh.mp4 \
                    delivery_class2_v3/Geometry8_Shaded_Areas_Class2_Opus55_V3.py \
            > delivery_class2_v3/SHA256SUMS.txt

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-shaded-areas-class2-opus55-v3-final
          path: manim_lessons/shaded_areas_first_steps/delivery_class2_v3/
          if-no-files-found: error
          retention-days: 14
