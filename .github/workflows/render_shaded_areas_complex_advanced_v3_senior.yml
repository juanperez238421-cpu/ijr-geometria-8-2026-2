name: Render Geometry8 Shaded Areas Advanced V3 Senior

on:
  push:
    branches:
      - temp/shaded-areas-complex-advanced-v3-20260930
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 150

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Python hierarchy
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          python -m py_compile             Geometry8_Shaded_Areas_Mixed_Basics_V2.py             Geometry8_Shaded_Areas_Opus55_V3.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V1.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V3.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V4_QA_FIXED.py             Geometry8_Shaded_Areas_Class2_Complex_Opus55_V5_FINAL.py             Geometry8_Shaded_Areas_Class2_Complex_4Plus_V6.py             Geometry8_Shaded_Areas_Complex_Advanced_V3.py
          grep -n "class Geometry8ShadedAreasComplexAdvancedV3"             Geometry8_Shaded_Areas_Complex_Advanced_V3.py
          sha256sum Geometry8_Shaded_Areas_Complex_Advanced_V3.py             | tee source_sha256.txt

      - name: Pull exact ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL senior structural QA
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          docker run --rm             --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=0.04             -v "$PWD:/manim"             -w /manim             --entrypoint bash             manimcommunity/manim:v0.20.1             -c "set -euo pipefail;                 mkdir -p /tmp/bin;                 printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open;                 chmod +x /tmp/bin/xdg-open;                 export PATH=/tmp/bin:\$PATH;                 manim -pql                   Geometry8_Shaded_Areas_Complex_Advanced_V3.py                   Geometry8ShadedAreasComplexAdvancedV3                   --format=mp4                   --disable_caching"             2>&1 | tee render_pql.log

      - name: Full literal PQH production render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          docker run --rm             --user "$(id -u):$(id -g)"             -e HOME=/tmp/manim-home             -e LESSON_TIME_SCALE=1.0             -v "$PWD:/manim"             -w /manim             --entrypoint bash             manimcommunity/manim:v0.20.1             -c "set -euo pipefail;                 mkdir -p /tmp/bin;                 printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open;                 chmod +x /tmp/bin/xdg-open;                 export PATH=/tmp/bin:\$PATH;                 manim -pqh                   Geometry8_Shaded_Areas_Complex_Advanced_V3.py                   Geometry8ShadedAreasComplexAdvancedV3                   --format=mp4                   --disable_caching"             2>&1 | tee render_pqh.log

      - name: Install media QA tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg
          python -m pip install --quiet pillow

      - name: Verify final media and build delivery
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps

          RAW="$(find media -type f             -name 'Geometry8ShadedAreasComplexAdvancedV3.mp4'             -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW"
          test -s "$RAW"

          OUT="delivery_advanced_v3"
          FINAL="$OUT/Geometry8_Shaded_Areas_Complex_Advanced_V3_FINAL_pqh.mp4"
          rm -rf "$OUT"
          mkdir -p "$OUT/qa_frames"

          cp "$RAW" "$FINAL"
          cp Geometry8_Shaded_Areas_Complex_Advanced_V3.py "$OUT/"
          cp render_pql.log render_pqh.log source_sha256.txt "$OUT/"

          ffprobe -v error             -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt             -show_entries format=duration,size             -of default=noprint_wrappers=1             "$FINAL" | tee "$OUT/FFPROBE.txt"

          grep -q '^codec_name=h264$' "$OUT/FFPROBE.txt"
          grep -q '^width=1920$' "$OUT/FFPROBE.txt"
          grep -q '^height=1080$' "$OUT/FFPROBE.txt"
          grep -q '^r_frame_rate=30/1$' "$OUT/FFPROBE.txt"
          grep -q '^pix_fmt=yuv420p$' "$OUT/FFPROBE.txt"

          # Full sequential decode.
          ffmpeg -v error -i "$FINAL" -f null -

          # Broad visual coverage for senior QA.
          ffmpeg -hide_banner -loglevel error             -i "$FINAL"             -vf "fps=1/35,scale=640:-1"             "$OUT/qa_frames/frame_%03d.jpg"

          sha256sum "$FINAL"             "$OUT/Geometry8_Shaded_Areas_Complex_Advanced_V3.py"             > "$OUT/SHA256SUMS.txt"

          {
            echo "branch=${GITHUB_REF_NAME}"
            echo "commit_sha=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "artifact_name=geometry8-shaded-areas-complex-advanced-v3-senior"
            echo "manim_image=manimcommunity/manim:v0.20.1"
            echo "problem_component_counts=6,5,7,5,7"
          } > "$OUT/RUN_METADATA.txt"

      - name: Build QA contact sheet
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          python - <<'PY'
          from pathlib import Path
          from PIL import Image, ImageDraw

          root = Path("delivery_advanced_v3")
          imgs = sorted((root / "qa_frames").glob("*.jpg"))
          assert imgs

          thumb = (440, 248)
          label_h = 30
          cols = 4
          cells = []

          for p in imgs:
              img = Image.open(p).convert("RGB")
              img.thumbnail(thumb)
              cell = Image.new("RGB", (thumb[0] + 16, thumb[1] + label_h), "white")
              cell.paste(img, ((cell.width - img.width)//2, 3))
              ImageDraw.Draw(cell).text((7, thumb[1] + 5), p.stem, fill="black")
              cells.append(cell)

          rows = (len(cells) + cols - 1) // cols
          sheet = Image.new(
              "RGB",
              (cols * cells[0].width, rows * cells[0].height),
              (235, 235, 235),
          )
          for i, cell in enumerate(cells):
              sheet.paste(cell, ((i % cols) * cell.width, (i // cols) * cell.height))

          sheet.save(root / "QA_CONTACT_SHEET.jpg", quality=92)
          print(f"QA contact sheet built from {len(imgs)} frames")
          PY

      - name: Upload senior final package
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-shaded-areas-complex-advanced-v3-senior
          path: manim_lessons/shaded_areas_first_steps/delivery_advanced_v3/
          if-no-files-found: error
          retention-days: 14
