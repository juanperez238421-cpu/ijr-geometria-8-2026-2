name: Render Geometry8 Shaded Areas First Steps V1

on:
  push:
    branches:
      - temp/shaded-areas-first-steps-v1-20260904
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          python -m py_compile Geometry8_Shaded_Areas_First_Steps_V1.py
          grep -n "class Geometry8ShadedAreasFirstStepsV1" Geometry8_Shaded_Areas_First_Steps_V1.py
          sha256sum Geometry8_Shaded_Areas_First_Steps_V1.py | tee source_sha256.txt

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL layout QA
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.05 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH=/tmp/bin:\$PATH; manim -pql Geometry8_Shaded_Areas_First_Steps_V1.py Geometry8ShadedAreasFirstStepsV1 --format=mp4 --disable_caching" \
            2>&1 | tee render_pql.log

      - name: Full literal PQH production render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH=/tmp/bin:\$PATH; manim -pqh Geometry8_Shaded_Areas_First_Steps_V1.py Geometry8ShadedAreasFirstStepsV1 --format=mp4 --disable_caching" \
            2>&1 | tee render_pqh.log

      - name: Stage and verify final delivery
        shell: bash
        run: |
          set -euo pipefail
          cd manim_lessons/shaded_areas_first_steps
          RAW="$(find media -type f -name 'Geometry8ShadedAreasFirstStepsV1.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW"
          test -s "$RAW"
          mkdir -p delivery
          cp "$RAW" delivery/Geometry8_Shaded_Areas_First_Steps_V1_FINAL_pqh.mp4
          cp Geometry8_Shaded_Areas_First_Steps_V1.py delivery/
          cp render_pql.log render_pqh.log source_sha256.txt delivery/

          # Keep media verification inside the same pinned ManimCE image used to render.
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; command -v ffprobe; ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 delivery/Geometry8_Shaded_Areas_First_Steps_V1_FINAL_pqh.mp4" \
            | tee delivery/FFPROBE.txt

          grep -q '^width=1920$' delivery/FFPROBE.txt
          grep -q '^height=1080$' delivery/FFPROBE.txt
          grep -q '^r_frame_rate=30/1$' delivery/FFPROBE.txt
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          ls -lh delivery

      - name: Upload final package
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-shaded-areas-first-steps-v1-final
          path: manim_lessons/shaded_areas_first_steps/delivery/
          if-no-files-found: error
          retention-days: 7
