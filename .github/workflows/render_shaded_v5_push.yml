name: Render Geometry8 Shaded V5 Push

on:
  push:
    branches:
      - temp/manim-week3-shaded-v5-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct V5
        shell: bash
        run: |
          set -euo pipefail
          mkdir render_v5
          base64 -d manim_week3_shaded_v4/payload.b64 > render_v5/payload.tar.gz
          cd render_v5
          tar -xzf payload.tar.gz
          test "$(sha256sum Geometry8_Week3_Class2_ShadedAreas_Senior_V4_FINAL.py | awk '{print $1}')" = "404c785ee5f73a46e155e4263a183e862041935c43961b7619006cc5b3f90dbf"
          cp Geometry8_Week3_Class2_ShadedAreas_Senior_V4_FINAL.py Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL.py
          patch Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL.py < ../manim_week3_shaded_v5/v4_to_v5.patch
          rm Geometry8_Week3_Class2_ShadedAreas_Senior_V4_FINAL.py
          python -m py_compile Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL.py jp_classroom_style.py
          test "$(sha256sum Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL.py | awk '{print $1}')" = "c29c0fd9bccdc388e284262cd315d4c0809f283058b94af33b70034757cf83fc"
          test "$(sha256sum jp_classroom_style.py | awk '{print $1}')" = "75ebb3b37b8b925ddf87ef0256c63e8c47a5f014f549f0330d600f540361921a"

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL QA
        shell: bash
        run: |
          set -euo pipefail
          cd render_v5
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=0.04 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "set -euo pipefail; mkdir -p /tmp/bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH=/tmp/bin:\$PATH; manim -pql Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL.py Geometry8Week3ShadedAreasSeniorV5Final --format=mp4 --disable_caching" 2>&1 | tee render_shaded_v5_pql.log

      - name: PQH final
        shell: bash
        run: |
          set -euo pipefail
          cd render_v5
          docker run --rm --user "$(id -u):$(id -g)" -e HOME=/tmp/manim-home -e LESSON_TIME_SCALE=1.0 -v "$PWD:/manim" -w /manim --entrypoint bash manimcommunity/manim:v0.20.1 -c "set -euo pipefail; mkdir -p /tmp/bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/bin/xdg-open; chmod +x /tmp/bin/xdg-open; export PATH=/tmp/bin:\$PATH; manim -pqh Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL.py Geometry8Week3ShadedAreasSeniorV5Final --format=mp4 --disable_caching" 2>&1 | tee render_shaded_v5_pqh.log

      - name: Stage
        shell: bash
        run: |
          set -euo pipefail
          cd render_v5
          RAW="$(find media -type f -name 'Geometry8Week3ShadedAreasSeniorV5Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW" && test -s "$RAW"
          mkdir delivery
          cp "$RAW" delivery/Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL_pqh.mp4
          cp Geometry8_Week3_Class2_ShadedAreas_Senior_V5_FINAL.py jp_classroom_style.py render_shaded_v5_pql.log render_shaded_v5_pqh.log delivery/
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-week3-shaded-v5-final
          path: render_v5/delivery/
          if-no-files-found: error
          retention-days: 7
