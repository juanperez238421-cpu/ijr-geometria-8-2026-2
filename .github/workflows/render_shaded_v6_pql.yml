name: Render Geometry8 Shaded V6 PQL QA

on:
  push:
    branches:
      - temp/manim-week3-shaded-v6-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pql-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact V6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_v6
          cat \
            manim_week3_shaded_v6/payload.part00 \
            manim_week3_shaded_v6/p01_00 \
            manim_week3_shaded_v6/p01_01 \
            manim_week3_shaded_v6/p01_02 \
            manim_week3_shaded_v6/p01_03 \
            manim_week3_shaded_v6/p01_04 \
            manim_week3_shaded_v6/p02_00 \
            manim_week3_shaded_v6/p02_01 \
            manim_week3_shaded_v6/p02_02 \
            manim_week3_shaded_v6/p02_03 \
            manim_week3_shaded_v6/p02_04 \
            manim_week3_shaded_v6/payload.part03 > render_v6/payload.b64
          test "$(wc -c < render_v6/payload.b64)" = "18324"
          base64 -d render_v6/payload.b64 > render_v6/payload.tar.gz
          test "$(sha256sum render_v6/payload.tar.gz | awk '{print $1}')" = "b16f8897ee1a92c0bf534b2f9deab11bffc24befaf15852bc44b63867d318dee"
          cd render_v6
          tar -xzf payload.tar.gz
          python -m py_compile Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py jp_classroom_style.py
          test "$(sha256sum Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py | awk '{print $1}')" = "d45567d9c9051cfffc9d7dd1e8b10463af67e0251671a0c1b4932e62f4a362a2"
          test "$(sha256sum jp_classroom_style.py | awk '{print $1}')" = "3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d"
          echo "Exact V6 source integrity verified."

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          cd render_v6
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.25 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/colab-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH=/tmp/colab-bin:\$PATH; manim -pql Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py Geometry8Week3ShadedAreasSeniorV6Final --format=mp4 --disable_caching" \
            2>&1 | tee render_v6_pql.log

      - name: Stage QA video
        shell: bash
        run: |
          set -euo pipefail
          cd render_v6
          RAW="$(find media -type f -name 'Geometry8Week3ShadedAreasSeniorV6Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW" && test -s "$RAW"
          mkdir -p delivery
          cp "$RAW" delivery/Geometry8_Week3_Class2_ShadedAreas_Senior_V6_PQL_QA.mp4
          cp Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py delivery/
          cp jp_classroom_style.py delivery/
          cp render_v6_pql.log delivery/
          sha256sum delivery/* > delivery/SHA256SUMS.txt

      - uses: actions/upload-artifact@v4
        with:
          name: geometry8-week3-shaded-v6-pql-qa
          path: render_v6/delivery/
          if-no-files-found: error
          retention-days: 7
