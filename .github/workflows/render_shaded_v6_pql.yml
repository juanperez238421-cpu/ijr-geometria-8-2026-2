name: Render Geometry8 Shaded V6 PQL QA

on:
  push:
    branches:
      - temp/manim-week3-shaded-v6-20260811
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pql-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Reconstruct exact V6
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p render_v6
          base64 -d manim_week3_shaded_v6/payload.b64 > render_v6/payload.tar.gz
          test "$(sha256sum render_v6/payload.tar.gz | awk '{print $1}')" = "a1f6b8eee7a371e66251ebe10b75737030e0a2acf2eee7ec54ee97534f883b27"
          cd render_v6
          tar -xzf payload.tar.gz
          python -m py_compile Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py jp_classroom_style.py
          test "$(sha256sum Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py | awk '{print $1}')" = "18cdac6a50beaa5b8abbe527240593872017be1d4271722362f7d7e31ec52db5"
          test "$(sha256sum jp_classroom_style.py | awk '{print $1}')" = "3f3f06e94d5cad870ad335502cc1a93e56ce675abb1231ded5f9c71fd3e60e3d"

      - name: Pull ManimCE 0.20.1
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL QA render
        shell: bash
        run: |
          set -euo pipefail
          cd render_v6
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.25 \
            -v "$PWD:/manim" -w /manim \
            --entrypoint bash manimcommunity/manim:v0.20.1 \
            -c "set -euo pipefail; mkdir -p /tmp/colab-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH=/tmp/colab-bin:\$PATH; manim -pql Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py Geometry8Week3ShadedAreasSeniorV6Final --format=mp4 --disable_caching" \
            2>&1 | tee render_v6_pql.log

      - name: Stage QA video
        shell: bash
        run: |
          set -euo pipefail
          cd render_v6
          RAW="$(find media -type f -name 'Geometry8Week3ShadedAreasSeniorV6Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$RAW" && test -s "$RAW"
          mkdir -p delivery
          cp "$RAW" delivery/Geometry8_Week3_Class2_ShadedAreas_Senior_V6_PQL_QA.mp4
          cp Geometry8_Week3_Class2_ShadedAreas_Senior_V6_FINAL.py delivery/
          cp render_v6_pql.log delivery/
          ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 delivery/Geometry8_Week3_Class2_ShadedAreas_Senior_V6_PQL_QA.mp4 > delivery/ffprobe.txt

      - uses: actions/upload-artifact@v4
        with:
          name: geometry8-week3-shaded-v6-pql-qa
          path: render_v6/delivery/
          if-no-files-found: error
          retention-days: 7
