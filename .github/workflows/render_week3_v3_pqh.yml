name: Render Geometry Week3 V3 PQH

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct, patch and compile V3
        shell: bash
        run: |
          set -euo pipefail
          cat manim_week3_v3_payload/payload.part* | base64 -d > geometry8_week3_v3.tar.gz
          tar -xzf geometry8_week3_v3.tar.gz
          python - <<'PY'
          from pathlib import Path
          p = Path('Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py')
          s = p.read_text(encoding='utf-8')
          old = 'fill_color=LIGHT_GRAY, fill_opacity=0.72).move_to(LEFT*3.35 + DOWN*0.62)'
          new = 'fill_color=LIGHT_GRAY, fill_opacity=0.72).move_to(LEFT*3.35 + DOWN*0.97)'
          assert old in s, 'expected square-example position not found'
          p.write_text(s.replace(old, new), encoding='utf-8')
          for name, old_class, new_class in [
              ('Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py', 'Geometry8Week3CircleTheorySeniorV3 --format', 'Geometry8Week3CircleTheorySeniorV3Final --format'),
              ('Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py', 'Geometry8Week3ShadedAreasSeniorV3 --format', 'Geometry8Week3ShadedAreasSeniorV3Final --format'),
          ]:
              q = Path(name)
              t = q.read_text(encoding='utf-8').replace(old_class, new_class)
              q.write_text(t, encoding='utf-8')
          PY
          python -m py_compile jp_classroom_style.py \
            Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py \
            Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py

      - name: Pull official ManimCE 0.20.1 image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: QA and final renders
        shell: bash
        run: |
          set -euo pipefail
          run_manim () {
            local scale="$1" quality="$2" source="$3" scene="$4" log="$5"
            docker run --rm \
              --user "$(id -u):$(id -g)" \
              -e HOME=/tmp/manim-home \
              -e LESSON_TIME_SCALE="$scale" \
              -v "$PWD:/manim" -w /manim \
              --entrypoint bash manimcommunity/manim:v0.20.1 \
              -c "set -euo pipefail; mkdir -p /tmp/colab-bin; printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/colab-bin/xdg-open; chmod +x /tmp/colab-bin/xdg-open; export PATH=/tmp/colab-bin:\$PATH; manim $quality '$source' '$scene' --format=mp4 --disable_caching" \
              2>&1 | tee "$log"
          }

          run_manim 0.04 -pql Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py Geometry8Week3CircleTheorySeniorV3Final render_circle_pql.log
          run_manim 0.04 -pql Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py Geometry8Week3ShadedAreasSeniorV3Final render_shaded_pql.log
          run_manim 1.0 -pqh Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py Geometry8Week3CircleTheorySeniorV3Final render_circle_pqh.log
          run_manim 1.0 -pqh Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py Geometry8Week3ShadedAreasSeniorV3Final render_shaded_pqh.log

      - name: Verify and stage delivery
        shell: bash
        run: |
          set -euo pipefail
          command -v ffprobe >/dev/null
          command -v ffmpeg >/dev/null
          mkdir -p delivery
          CIRCLE="$(find media -type f -name 'Geometry8Week3CircleTheorySeniorV3Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          SHADED="$(find media -type f -name 'Geometry8Week3ShadedAreasSeniorV3Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$CIRCLE" && test -s "$CIRCLE"
          test -n "$SHADED" && test -s "$SHADED"
          cp "$CIRCLE" delivery/Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL_pqh.mp4
          cp "$SHADED" delivery/Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL_pqh.mp4
          cp Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py delivery/
          cp Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py delivery/
          cp jp_classroom_style.py delivery/
          cp render_*log delivery/

          for f in delivery/*.mp4; do
            meta="${f%.mp4}.ffprobe.txt"
            ffprobe -v error -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt -show_entries format=duration,size -of default=noprint_wrappers=1 "$f" > "$meta"
            grep -q '^codec_name=h264$' "$meta"
            grep -q '^width=1920$' "$meta"
            grep -q '^height=1080$' "$meta"
            grep -q '^pix_fmt=yuv420p$' "$meta"
            grep -q '^r_frame_rate=30/1$' "$meta"
            ffmpeg -v error -i "$f" -f null -
          done
          sha256sum delivery/* > delivery/SHA256SUMS.txt
          ls -lh delivery

      - name: Upload verified artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-week3-v3-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
