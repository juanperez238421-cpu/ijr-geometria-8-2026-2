name: Render Geometry Week3 V3 PQH

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Reconstruct V3 source payload
        shell: bash
        run: |
          set -euo pipefail
          cat manim_week3_v3_payload/payload.part* | base64 -d > geometry8_week3_v3.tar.gz
          tar -xzf geometry8_week3_v3.tar.gz
          test -s jp_classroom_style.py
          test -s Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py
          test -s Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py

          # Keep the embedded render commands aligned with the final class names.
          sed -i 's/Geometry8Week3CircleTheorySeniorV3 --format/Geometry8Week3CircleTheorySeniorV3Final --format/' Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py
          sed -i 's/Geometry8Week3ShadedAreasSeniorV3 --format/Geometry8Week3ShadedAreasSeniorV3Final --format/' Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py

      - name: Validate Python syntax
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            jp_classroom_style.py \
            Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py \
            Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py

      - name: Pull official ManimCE 0.20.1 image
        shell: bash
        run: |
          set -euo pipefail
          docker pull manimcommunity/manim:v0.20.1

      - name: Low-quality QA render - Circle Theory
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.04 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py \
                Geometry8Week3CircleTheorySeniorV3Final \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_circle_pql.log

      - name: Low-quality QA render - Shaded Areas
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.04 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pql Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py \
                Geometry8Week3ShadedAreasSeniorV3Final \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_shaded_pql.log

      - name: Final literal -pqh render - Circle Theory
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py \
                Geometry8Week3CircleTheorySeniorV3Final \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_circle_pqh.log

      - name: Final literal -pqh render - Shaded Areas
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c '
              set -euo pipefail
              mkdir -p /tmp/colab-bin
              printf "#!/usr/bin/env bash\nexit 0\n" > /tmp/colab-bin/xdg-open
              chmod +x /tmp/colab-bin/xdg-open
              export PATH="/tmp/colab-bin:$PATH"
              manim -pqh Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py \
                Geometry8Week3ShadedAreasSeniorV3Final \
                --format=mp4 --disable_caching
            ' 2>&1 | tee render_shaded_pqh.log

      - name: Verify and stage final delivery
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p delivery

          CIRCLE="$(find media -type f -name 'Geometry8Week3CircleTheorySeniorV3Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          SHADED="$(find media -type f -name 'Geometry8Week3ShadedAreasSeniorV3Final.mp4' -printf '%T@ %p\n' | sort -nr | head -1 | cut -d' ' -f2-)"
          test -n "$CIRCLE" && test -s "$CIRCLE"
          test -n "$SHADED" && test -s "$SHADED"

          cp "$CIRCLE" delivery/Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL_pqh.mp4
          cp "$SHADED" delivery/Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL_pqh.mp4
          cp Geometry8_Week3_Class1_CircleTheory_Senior_V3_FINAL.py delivery/
          cp Geometry8_Week3_Class2_ShadedAreas_Senior_V3_FINAL.py delivery/
          cp jp_classroom_style.py delivery/
          cp render_circle_pql.log render_shaded_pql.log render_circle_pqh.log render_shaded_pqh.log delivery/

          for f in delivery/*.mp4; do
            ffprobe -v error \
              -show_entries stream=codec_name,width,height,r_frame_rate,pix_fmt \
              -show_entries format=duration,size \
              -of default=noprint_wrappers=1 \
              "$f" > "${f%.mp4}.ffprobe.txt"

            grep -q '^codec_name=h264$' "${f%.mp4}.ffprobe.txt"
            grep -q '^width=1920$' "${f%.mp4}.ffprobe.txt"
            grep -q '^height=1080$' "${f%.mp4}.ffprobe.txt"
            grep -q '^pix_fmt=yuv420p$' "${f%.mp4}.ffprobe.txt"
            grep -q '^r_frame_rate=30/1$' "${f%.mp4}.ffprobe.txt"

            ffmpeg -v error -i "$f" -f null -
          done

          sha256sum delivery/* > delivery/SHA256SUMS.txt
          ls -lh delivery/

      - name: Upload verified delivery artifact
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-week3-v3-pqh
          path: delivery/
          if-no-files-found: error
          retention-days: 7
