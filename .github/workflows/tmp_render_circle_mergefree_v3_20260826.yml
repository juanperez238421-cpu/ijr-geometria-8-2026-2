name: TMP Render Circle SeniorSmooth V3 MergeFree

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout reviewed render branch
        uses: actions/checkout@v4
        with:
          ref: circle-area-pi-workshop-mergefree-v3-20260826

      - name: Validate Python sources
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          python -m py_compile \
            circle_classroom_style.py \
            Geometry8_Circle_Pi_Mixed_Workshop.py \
            Geometry8_Circle_Projection_Workshop.py \
            Geometry8_Circle_Projection_Workshop_Final.py \
            Geometry8_Circle_Projection_Workshop_SeniorSmooth.py

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.10 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pql Geometry8_Circle_Projection_Workshop_SeniorSmooth.py Geometry8CircleProjectionWorkshopSeniorSmooth --format=mp4 --disable_caching'

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf final_media_mergefree_v3
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pqh Geometry8_Circle_Projection_Workshop_SeniorSmooth.py Geometry8CircleProjectionWorkshopSeniorSmooth --format=mp4 --disable_caching --fps 30 --resolution 1920,1080 --media_dir final_media_mergefree_v3'

      - name: Verify decode and package
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf delivery_mergefree_v3
          mkdir -p delivery_mergefree_v3
          SRC="$(find final_media_mergefree_v3 -type f -name 'Geometry8CircleProjectionWorkshopSeniorSmooth.mp4' -print -quit)"
          test -n "$SRC"
          test -s "$SRC"
          OUT='delivery_mergefree_v3/Geometry8_Circle_3D_to_2D_SENIOR_QA_V3_MERGEFREE_FINAL_pqh.mp4'
          cp "$SRC" "$OUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate -of json "$OUT" > delivery_mergefree_v3/ffprobe.json
          python3 - <<'PY'
          import json
          from fractions import Fraction
          s=json.load(open('delivery_mergefree_v3/ffprobe.json'))['streams'][0]
          assert s['codec_name']=='h264', s
          assert int(s['width'])==1920 and int(s['height'])==1080, s
          assert s['pix_fmt']=='yuv420p', s
          assert Fraction(s['r_frame_rate'])==30, s
          print('VERIFIED 1920x1080 30fps H.264 yuv420p')
          PY
          ffmpeg -v error -i "$OUT" -f null -
          cp Geometry8_Circle_Projection_Workshop_SeniorSmooth.py delivery_mergefree_v3/
          sha256sum "$OUT" > delivery_mergefree_v3/SHA256SUMS.txt

      - name: Upload verified merge-free render
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-circle-senior-qa-v3-mergefree-pqh
          path: manim_circle_20260826/delivery_mergefree_v3/
          if-no-files-found: error
