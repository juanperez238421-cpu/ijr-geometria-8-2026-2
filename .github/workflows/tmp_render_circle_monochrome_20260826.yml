name: TMP Render Circle Monochrome PQH

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/tmp_render_circle_monochrome_20260826.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout latest circle QA branch
        uses: actions/checkout@v4
        with:
          ref: circle-area-pi-workshop-20260826

      - name: Validate Python sources
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          python -m py_compile \
            circle_classroom_style.py \
            Geometry8_Circle_Pi_Mixed_Workshop.py \
            Geometry8_Circle_Projection_Workshop.py \
            Geometry8_Circle_Projection_Workshop_Final.py

      - name: Pull pinned ManimCE image
        run: docker pull manimcommunity/manim:v0.20.1

      - name: PQL smoke render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=0.08 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pql Geometry8_Circle_Projection_Workshop_Final.py Geometry8CircleProjectionWorkshopFinal --format=mp4 --disable_caching'

      - name: Final literal PQH render
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf final_media_monochrome
          mkdir -p /tmp/manim-bin
          printf '#!/usr/bin/env bash\nexit 0\n' > /tmp/manim-bin/xdg-open
          chmod +x /tmp/manim-bin/xdg-open
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            -e HOME=/tmp/manim-home \
            -e LESSON_TIME_SCALE=1.0 \
            -v "$PWD:/manim" \
            -v /tmp/manim-bin:/tmp/manim-bin:ro \
            -w /manim \
            --entrypoint bash \
            manimcommunity/manim:v0.20.1 \
            -c 'export PATH="/tmp/manim-bin:$PATH"; manim -pqh Geometry8_Circle_Projection_Workshop_Final.py Geometry8CircleProjectionWorkshopFinal --format=mp4 --disable_caching --fps 30 --resolution 1920,1080 --media_dir final_media_monochrome'

      - name: Verify and package
        shell: bash
        run: |
          set -euo pipefail
          cd manim_circle_20260826
          rm -rf delivery_monochrome
          mkdir -p delivery_monochrome
          SRC="$(find final_media_monochrome -type f -name 'Geometry8CircleProjectionWorkshopFinal.mp4' -print -quit)"
          test -n "$SRC"
          test -s "$SRC"
          OUT='delivery_monochrome/Geometry8_Circle_3D_to_2D_Workshop_MONOCHROME_FINAL_pqh.mp4'
          cp "$SRC" "$OUT"
          ffprobe -v error -select_streams v:0 -show_entries stream=codec_name,width,height,pix_fmt,r_frame_rate -of json "$OUT" > delivery_monochrome/ffprobe.json
          python3 - <<'PY'
          import json
          from fractions import Fraction
          p='delivery_monochrome/ffprobe.json'
          s=json.load(open(p))['streams'][0]
          assert int(s['width'])==1920
          assert int(s['height'])==1080
          assert Fraction(s['r_frame_rate'])==30
          assert s['codec_name']=='h264'
          assert s['pix_fmt']=='yuv420p'
          print('VERIFIED 1920x1080 30fps H.264 yuv420p')
          PY
          ffmpeg -v error -i "$OUT" -f null -
          sha256sum "$OUT" > delivery_monochrome/SHA256SUMS.txt
          cp Geometry8_Circle_Projection_Workshop_Final.py delivery_monochrome/

      - name: Upload verified monochrome workshop
        uses: actions/upload-artifact@v4
        with:
          name: geometry8-circle-monochrome-final-pqh
          path: manim_circle_20260826/delivery_monochrome/
          if-no-files-found: error
